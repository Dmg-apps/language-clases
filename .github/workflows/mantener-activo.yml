# Mantiene activo el proyecto gratuito de Supabase (se pausa tras 7 días sin actividad).
# Cada 3 días llama a la función ping() (devuelve 1 y no lee ningún dato).
# Una vez al mes actualiza .github/latido.txt para que GitHub no desactive esta tarea
# (GitHub desactiva las tareas programadas tras 60 días sin cambios en el repositorio).
name: Mantener Supabase activo
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "apikey: sb_publishable_UdB9kGZXOTTNNhe33jOyfQ_k37TRkYD" -H "Content-Type: application/json" \
              -d '{}' "https://kslnlfmzlgyqkbrqrhdg.supabase.co/rest/v1/rpc/ping")
            echo "Respuesta: $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
  latido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Latido mensual
        run: |
          mes=$(date -u +%Y-%m)
          if [ "$(cat .github/latido.txt 2>/dev/null)" != "$mes" ]; then
            echo "$mes" > .github/latido.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/latido.txt && git commit -m "Latido mensual" && git push
          fi
